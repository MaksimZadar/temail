name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref; a newer push or PR update cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GTK4 / WebKitGTK 6.0 dev packages for the cgo Linux app build
      # (same set as README "Linux" and `mise run doctor`).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev

      - name: Set up mise (tools and cache)
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Setup (modules, frontend deps, wails3 CLI)
        run: mise run setup

      - name: Check (lint, test, typecheck)
        run: mise run check

      - name: Build (cgo Linux app)
        run: mise run build
