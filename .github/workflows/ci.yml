name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GTK4 / WebKitGTK 6.0 dev packages needed by the cgo Linux app build
      # (see README "Linux (CachyOS / Arch)" and `mise run doctor`).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Setup
        run: mise run setup

      - name: Check
        run: mise run check

      # On a fresh checkout the Taskfile's generate:icons step runs `wails3 generate
      # icons`, which writes build/darwin/icon.icns relative to the task's build/ dir
      # and fails if that directory is missing (the repo has no darwin templates).
      # Local runs skip it because .task/ caches the checksum.
      - name: Prepare wails3 icon output dir
        run: mkdir -p build/build/darwin

      - name: Build
        run: mise run build
